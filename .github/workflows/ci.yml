name: CI

on:
  pull_request:
    branches:
      - stage
      - release

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest

    # Safety: the suite runs here on the GitHub runner only, and phpunit.xml
    # pins it to an in-memory SQLite database. Nothing connects to the stage or
    # production MySQL server, so a test run cannot read, write or drop real data.
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, intl, zip, gd, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare Test Environment
        run: |
          cp .env.example .env
          php artisan key:generate
          # storage/ is gitignored, so a fresh checkout has no Passport keys and
          # every Passport::actingAs() test dies with "Invalid key supplied".
          php artisan passport:keys --force

      # Run as two steps so the log shows plainly that both suites ran.
      - name: Run Unit Tests
        run: php artisan test --testsuite=Unit

      - name: Run Feature Tests
        run: php artisan test --testsuite=Feature
